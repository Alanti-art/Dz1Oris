<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель — Переворот</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 18px;
            line-height: 1.5;
            background: #070F08;
            color: #B6A8A2;
        }

            body::before {
                content: "";
                position: fixed;
                inset: -40px;
                z-index: -1;
                background: url("https://filgroup.ru/wp-content/uploads/2024/07/22.-Perevorot.webp") center / cover;
                filter: blur(14px) brightness(0.3);
            }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: 760px;
            max-width: 100%;
            min-height: 100vh;
            margin: 0 auto;
            background: #090c0c;
        }

        .header {
            padding: 14px 28px;
            border-bottom: 1px solid #7A4A3C;
            text-align: center;
        }

        .logo {
            color: #D8CCC6;
            font-size: 22px;
            font-weight: bold;
        }

        .login-box {
            width: 460px;
            max-width: 100%;
            margin: 90px auto;
            padding: 30px;
            border: 1px solid #7A4A3C;
            border-radius: 14px;
        }

        h1 {
            margin-top: 0;
            color: #D8CCC6;
            font-size: 34px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            color: #D8CCC6;
            font-weight: bold;
        }

        input {
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            font: inherit;
            color: #D8CCC6;
            background: #090c0c;
            border: 1px solid #7A4A3C;
            border-radius: 8px;
        }

        .error {
            margin-top: 18px;
            padding: 10px 12px;
            color: #FFB4A2;
            text-align: center;
            background: rgba(122, 74, 60, 0.18);
            border-left: 3px solid #C0634E;
            border-radius: 6px;
        }

        .btn {
            width: 100%;
            margin-top: 26px;
            padding: 10px;
            font: inherit;
            font-weight: bold;
            color: #D8CCC6;
            cursor: pointer;
            background: transparent;
            border: 1px solid #D8CCC6;
            border-radius: 999px;
        }

            .btn:hover {
                color: #090c0c;
                background: #D8CCC6;
            }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <a class="logo" href="/">♛ Переворот</a>
        </div>

        <form class="login-box" action="/auth/login" method="post">
            <h1>Вход в админ-панель</h1>

            <label for="login">Логин</label>
            <input id="login" name="login" type="text" value="${Login}" required>

            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" required>

            <button class="btn" type="submit">Войти</button>

            $if (${HasError})
            <div class="error" role="alert">${ErrorMessage}</div>
            $else
            <div> </div>
            $endif

            <a class="back" href="/">← Вернуться на сайт</a>
        </form>
    </div>
</body>
</html>
