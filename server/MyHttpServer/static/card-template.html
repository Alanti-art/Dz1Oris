<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${Name} — Переворот</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 18px;
            line-height: 1.5;
            background: #070F08;
            color: #B6A8A2;
        }

        .page {
            max-width: 760px;
            min-height: 100vh;
            margin: 0 auto;
            background: #090c0c;
        }

        .header {
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #7A4A3C;
        }

        .logo, a {
            color: #D8CCC6;
            text-decoration: none;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .navigation a {
            margin-left: 20px;
        }

        .container {
            padding: 20px 28px 50px;
        }

        .block {
            margin-top: 50px;
        }

        .card-image {
            display: block;
            width: 300px;
            height: 450px;
            margin: 0 auto 30px;
            object-fit: cover;
            border: 1px solid #7A4A3C;
            border-radius: 140px 140px 12px 12px;
        }

        .card-name {
            margin: 0;
            color: #D8CCC6;
            font-size: 48px;
            text-align: center;
        }

        .card-description {
            max-width: 520px;
            margin: 14px auto 25px;
            text-align: center;
        }

        .property {
            max-width: 520px;
            margin: 12px auto;
            padding: 10px 14px;
            border-left: 1px solid #7A4A3C;
        }

        .property-title {
            color: #D8CCC6;
            font-weight: bold;
        }

        .footer {
            padding: 26px 28px;
            border-top: 1px solid #7A4A3C;
            font-size: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="page">
        <div class="header">
            <a class="logo" href="/">♛ Переворот</a>
            <div class="navigation">
                <a href="/#rules">Правила</a>
                <a href="/characters/list">Карточки</a>
            </div>
        </div>

        <div class="container">
            <div class="block">
                <img class="card-image" src="${Image}" alt="${Name}">
                <h1 class="card-name">${Name}</h1>
                <p class="card-description">${Description}</p>

                <div class="property"><span class="property-title">Действие:</span> ${Action}</div>
                <div class="property"><span class="property-title">Блокирует:</span> ${Blocks}</div>
                <div class="property"><span class="property-title">Стоимость:</span> ${Cost}</div>
                <div class="property"><span class="property-title">Блокируется:</span> ${BlockedBy}</div>
            </div>
        </div>

        <div class="footer">♛ Переворот — неофициальная страница настольной игры.</div>
    </div>
</body>
</html>
