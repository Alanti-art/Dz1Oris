services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cardgame-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./docker/init-db.sh:/usr/local/bin/init-db.sh:ro
    command: ["/bin/bash", "-lc", "tr -d '\\r' < /usr/local/bin/init-db.sh > /tmp/init-db.sh && bash /tmp/init-db.sh"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cardgame-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:8888"
    # Приложение интерактивно ждёт команду "start" в консоли (код не менялся),
    # поэтому подаём "start" на stdin и держим ввод открытым.
    command: ["/bin/sh", "-c", "(echo start; tail -f /dev/null) | dotnet MyHttpServer.dll"]

volumes:
  mssqldata:
